name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # Docs-only changes shouldn't trigger a production deploy — they're
    # published separately by .github/workflows/docs-pages.yml. Any commit
    # that also touches code still deploys as normal.
    paths-ignore:
      - "docs/**"
      - "docfx.json"
      - "toc.yml"
      - "index.md"
      - "**/*.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

# Avoid overlapping deploys racing migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Needed to push the release tag back to the repo.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Surface secrets as env so steps can detect whether deploy is configured.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Deploy secrets are mandatory. Fail loud if missing — a silently skipped
      # deploy looks green but leaves production stale (or, with a proxied DNS
      # record and no worker, hanging). See DEPLOYMENT.md.
      - name: Check deploy is configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Deploy secrets not set (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID). Set them in repo settings — see DEPLOYMENT.md."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # One version per deploy: date + the monotonic run number (e.g. v2026.06.26-42).
      # Baked into the build (footer) and used as the git tag after a clean deploy.
      - name: Compute version
        if: steps.gate.outputs.ready == 'true'
        id: version
        run: echo "version=v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: steps.gate.outputs.ready == 'true'
        run: npx prisma generate

      # The verification steps below all run before the migration step on purpose:
      # a failed check should stop the deploy outright, not after production's
      # schema has already moved. A failing step here skips every later step —
      # migrate, build, deploy and tag — because GitHub applies an implicit
      # success() to an `if:` that has no status-check function of its own.
      #
      # `npm test` is `vitest run`, not watch mode. A watching runner would never
      # exit, and this job's `concurrency: deploy-production` group is
      # cancel-in-progress: false, so it would queue every later deploy behind it
      # until the job timed out.
      - name: Run unit tests
        if: steps.gate.outputs.ready == 'true'
        run: npm test

      # `npm run lint` is deliberately NOT here yet — it currently exits non-zero
      # on two pre-existing errors (src/app/admin/analytics/page.tsx and
      # src/components/federation-banner-client.tsx), so adding it today would
      # block every deploy. Fix those, then add it to this line.
      - name: Verify write gates
        if: steps.gate.outputs.ready == 'true'
        run: npm run check:gates

      - name: Apply D1 migrations (production)
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply demoify --remote

      - name: Build & deploy (OpenNext → Cloudflare Workers)
        if: steps.gate.outputs.ready == 'true'
        # BETTER_AUTH_SECRET is surfaced to the build so better-auth doesn't fall
        # back to its default secret while collecting page data. The worker's
        # runtime copy is set separately via `wrangler secret put` (see DEPLOYMENT.md).
        # NEXT_PUBLIC_APP_VERSION is inlined into the bundle and shown in the footer.
        #
        # NEXT_PUBLIC_APP_URL must be set HERE, not only in wrangler.jsonc: those
        # are runtime Worker vars, and `metadataBase` is resolved at BUILD time
        # for every statically rendered page (/terms, /privacy, /dmca). Without
        # it those pages bake og:url and og:image as http://localhost:3000 and
        # every social card silently breaks. Being NEXT_PUBLIC_*, it is inlined
        # into the bundle, so it also covers the runtime paths.
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
          NEXT_PUBLIC_APP_URL: https://demoify.app
        run: npm run deploy

      # Tag the deployed commit with the same version now that the deploy succeeded.
      - name: Tag release
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
